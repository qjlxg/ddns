name: free_source_aggregator

on:
  push:
    paths:
      - "free_source_aggregator.py"
      - ".github/workflows/free_source_aggregator.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install aiohttp pyyaml

      - name: Run
        run: python free_source_aggregator.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "auto update source results"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: free_source_aggregator
          path: output/
