name: httpx_probe

on:
  # 当脚本或工作流本身变动时自动运行
  push:
    paths:
      - 'httpx_probe.py'
      - '.github/workflows/httpx_probe.yml'
      - 'targets.txt'
    branches:
      - main
      - master

  # 手动触发
  workflow_dispatch:

  # 定时：每天北京时间 09:00（UTC 01:00）
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write   # 需要写权限才能 push CSV 回仓库

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4

      - name: Check targets.txt
        id: check_targets
        run: |
          if [ ! -f targets.txt ]; then
            echo "targets.txt 不存在，创建示例文件"
            echo -e "# 示例目标（请替换为真实 FOFA 导出的域名）\nexample.com\nhttpbin.org" > targets.txt
          fi
          echo "target_count=$(grep -v '^#' targets.txt | grep -v '^$' | wc -l)" >> $GITHUB_OUTPUT
          echo "目标数量: $(grep -v '^#' targets.txt | grep -v '^$' | wc -l)"

      - name: Run httpx_probe.py
        run: |
          python httpx_probe.py
        env:
          PYTHONUNBUFFERED: 1

      - name: Show results summary
        run: |
          echo "===== 最新结果预览 ====="
          if [ -f results/httpx_probe_latest.csv ]; then
            head -n 15 results/httpx_probe_latest.csv
            echo "..."
            echo "总行数: $(wc -l < results/httpx_probe_latest.csv)"
          else
            echo "未生成结果文件"
          fi

      - name: Commit and push CSV results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 只提交 results 目录下的 csv
          git add results/*.csv || true

          # 如果有变化才提交
          if git diff --staged --quiet; then
            echo "没有新的结果需要提交"
          else
            TIMESTAMP=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')
            git commit -m "chore: update httpx_probe results (${TIMESTAMP} BJT)"
            git push
            echo "结果已推送到仓库"
          fi
