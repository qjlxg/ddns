name: Legado Booksource Sync

# 触发条件配置
on:
  # 1. 每次你手动修改并推送到 main 分支时自动触发
  push:
    branches:
      - main
    paths:
      - 'booksource_sync.py'                        # 当 Python 脚本变动时
      - '.github/workflows/booksource_sync.yml' # 或者工作流本身变动时

  # 2. 定时触发（支持北京时间）
  schedule:
    # GitHub Actions 的 cron 表达式使用 UTC 时间。
    # 北京时间早上 8:00 即为 UTC 时间 00:00。
    - cron: '0 0 * * *'

  # 3. 允许你在 GitHub 网页端手动点击按钮触发
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # 检出代码库
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      # 安装依赖
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "httpx[http2]" beautifulsoup4 lxml

   
      - name: Run Booksource Cleaning Script
        env:
          bot: ${{ secrets.bot }}
        run: |
          python booksource_sync.py

      # 自动将生成的 exportBookSource.json 提交回仓库
      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 检查是否有文件变动
          git status
          git add exportBookSource.json
          
          # 如果没有变动则跳过提交
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update valid booksources [skip ci]" && git push)
