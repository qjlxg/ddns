name: Legado Booksource Sync

on:
  push:
    branches:
      - main
    paths:
      - 'booksource_sync.py'
      - '.github/workflows/booksource_sync.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "httpx[http2]" beautifulsoup4 lxml

      - name: Run Booksource Cleaning Script
        env:
          bot: ${{ secrets.bot }}
        run: |
          python booksource_sync.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull --rebase origin main
          
          git status
          git add exportBookSource.json search_stats.csv
          
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update valid booksources [skip ci]" && git push)
